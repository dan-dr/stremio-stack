# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 20
    groups:
      infra:
        patterns:
          - "postgres"
          - "redis"
          - "ghcr.io/browserless/chromium"
          - "lscr.io/linuxserver/nzbhydra2"
          - "tailscale/tailscale"
      addons:
        patterns:
          - "ghcr.io/g0ldyy/comet"
          - "muniftanjim/stremthru"
          - "mhdzumair/mediafusion"
          - "ghcr.io/viren070/aiostreams"
          - "ghcr.io/cedya77/aiometadata"
          - "ghcr.io/iamneur0/syncio"
          - "registry.gitlab.com/deejay189393/streams-prefetcher"
          - "ghcr.io/timilsinabimal/watchly"
          - "ghcr.io/sanket9225/usenetstreamer"
