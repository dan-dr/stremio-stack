name: stremio

services:
  compossador:
    image: ghcr.io/dan-dr/compossador:latest
    container_name: compossador
    restart: unless-stopped
    depends_on:
      comet:
        condition: service_started
      stremthru:
        condition: service_started
      mediafusion:
        condition: service_started
      nzbhydra2:
        condition: service_started
      usenetstreamer:
        condition: service_started
      aiostreams:
        condition: service_started
      aiometadata:
        condition: service_started
      syncio:
        condition: service_started
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DISCOVERY_INTERVAL: 30
      INCLUDE_SERVICES: ${COMPOSSADOR_INCLUDE_SERVICES:-comet,stremthru,mediafusion,nzbhydra2,usenetstreamer,aiostreams,aiometadata,syncio}
      EXCLUDE_SERVICES: ${COMPOSSADOR_EXCLUDE_SERVICES:-}
    networks:
      default:
        aliases:
          - ddyo

  # ---------------------------------------------------------------------------
  # Shared infra (consolidated)
  # ---------------------------------------------------------------------------
  postgres:
    # Postgres 17
    # We also use it as the single Postgres instance for MediaFusion/Comet/Zilean/Trakt-addon.
    image: postgres:17-alpine
    container_name: stremio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - ${POSTGRES_PORT}:5432
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "huge_pages=off"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "max_worker_processes=8"
      - "-c"
      - "max_parallel_workers_per_gather=2"
      - "-c"
      - "max_parallel_workers=4"
      - "-c"
      - "max_parallel_maintenance_workers=2"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./initdb/100-create-dbs.sh:/docker-entrypoint-initdb.d/100-create-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: stremio-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Stream sources (AIOStreams upstreams)
  # ---------------------------------------------------------------------------
  comet:
    image: ghcr.io/g0ldyy/comet@sha256:dca62133336e02784d02aaad861381820674d1c8e3e98a03797610b81ee4defe
    container_name: comet
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_TYPE: postgresql
      # Comet expects user:pass@host:port/db (no scheme)
      DATABASE_URL: ${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${COMET_DB}
      FASTAPI_PORT: 8000
      ADMIN_DASHBOARD_PASSWORD: ${COMET_ADMIN_PASSWORD}
      # No anime
      ANIME_MAPPING_ENABLED: "false"
    ports:
      - ${COMET_PORT}:8000

  # zilean:
  #   image: ipromknight/zilean:v3.5.0
  #   container_name: zilean
  #   restart: unless-stopped
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   environment:
  #     Zilean__EnableDashboard: "true"
  #     Zilean__Database__ConnectionString: Host=postgres;Database=${ZILEAN_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Include Error Detail=true;Timeout=30;CommandTimeout=3600
  #     Zilean__Imdb__UseAllCores: "true"
  #     Zilean__Imdb__UseLucene: "true"
  #     Zilean__Parsing__BatchSize: "100000"
  #     Zilean__Dmm_ScrapeSchedule: "32 * * * *"
  #   ports:
  #     - ${ZILEAN_PORT}:8181

  stremthru:
    image: muniftanjim/stremthru:0.104.0
    container_name: stremthru
    restart: unless-stopped
    environment:
      STREMTHRU_BASE_URL: ${STREMTHRU_BASE_URL}
      STREMTHRU_PORT: 8080
      STREMTHRU_LOG_LEVEL: INFO
      STREMTHRU_LOG_FORMAT: json
      STREMTHRU_VAULT_SECRET: ${STREMTHRU_VAULT_SECRET}
      STREMTHRU_CONTENT_PROXY_CONNECTION_LIMIT: "*:0"
      # Keep StremThru on sqlite (avoids extra DB/user mgmt)
      STREMTHRU_DATABASE_URI: sqlite:///app/data/stremthru.sqlite
    volumes:
      - ./data/stremthru:/app/data
    ports:
      - ${STREMTHRU_PORT}:8080

  ###################
  ### MEDIAFUSION ###
  ###################
  mediafusion:
    image: mhdzumair/mediafusion:6.1.5
    container_name: mediafusion
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      HOST_URL: ${MEDIAFUSION_HOST_URL}
      CONTACT_EMAIL: ${MEDIAFUSION_CONTACT_EMAIL:-admin@example.com}
      SECRET_KEY: ${MEDIAFUSION_SECRET_KEY}
      API_PASSWORD: ${MEDIAFUSION_API_PASSWORD}
      LOGGING_LEVEL: INFO
      STREAM_RS_PORT: 8000
      # PostgreSQL (native)
      POSTGRES_URI: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${MEDIAFUSION_DB}
      # Shared redis (use db 1)
      REDIS_URL: redis://redis:6379/1
      TRAWL_URL: http://trawl:8191
      PUBLIC_INDEXERS_LIVE_SEARCH_ENABLE_CLOUDFLARE_SOLVER: "true"
      TASKIQ_SINGLE_WORKER_MODE: "true"
      # Don't use Torrentio
      IS_SCRAP_FROM_TORRENTIO: "true"
    ports:
      - ${MEDIAFUSION_PORT}:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  mediafusion-worker:
    image: mhdzumair/mediafusion:6.1.5
    container_name: mediafusion-worker
    command: ["/usr/local/bin/mediafusion-worker"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      trawl:
        condition: service_healthy
    environment:
      HOST_URL: ${MEDIAFUSION_HOST_URL}
      CONTACT_EMAIL: ${MEDIAFUSION_CONTACT_EMAIL:-admin@example.com}
      SECRET_KEY: ${MEDIAFUSION_SECRET_KEY}
      API_PASSWORD: ${MEDIAFUSION_API_PASSWORD}
      LOGGING_LEVEL: INFO
      POSTGRES_URI: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${MEDIAFUSION_DB}
      REDIS_URL: redis://redis:6379/1
      TRAWL_URL: http://trawl:8191
      PUBLIC_INDEXERS_LIVE_SEARCH_ENABLE_CLOUDFLARE_SOLVER: "true"
      TASKIQ_SINGLE_WORKER_MODE: "true"
      IS_SCRAP_FROM_TORRENTIO: "true"

  trawl:
    image: ghcr.io/germondai/trawl:1.5.0
    container_name: trawl
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/4
      BROWSER_POOL_SIZE: "1"
    shm_size: 1gb
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8191/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  nzbhydra2:
    image: lscr.io/linuxserver/nzbhydra2:8.9.0
    container_name: nzbhydra2
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1002}
      PGID: ${PGID:-1002}
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ./data/nzbhydra2:/config
    ports:
      - ${NZBHYDRA2_PORT}:5076

  usenetstreamer:
    image: ghcr.io/sanket9225/usenetstreamer:1.8.4
    container_name: usenetstreamer
    restart: unless-stopped
    depends_on:
      - nzbhydra2
    environment:
      ADDON_BASE_URL: ${USENETSTREAMER_BASE_URL}
      ADDON_SHARED_SECRET: ${USENETSTREAMER_SHARED_SECRET}
      CONFIG_DIR: /data/config
      INDEXER_MANAGER: nzbhydra
      INDEXER_MANAGER_URL: http://nzbhydra2:5076
      INDEXER_MANAGER_API_KEY: ${NZBHYDRA2_API_KEY:-}
      INDEXER_MANAGER_INDEXERS: "-1"
      TMDB_API_KEY: ${TMDB_API_KEY}
      TVDB_API_KEY: ${TVDB_API_KEY}
      STREAMING_MODE: ${USENETSTREAMER_STREAMING_MODE:-native}
    volumes:
      - ./data/usenetstreamer:/data/config
    ports:
      - ${USENETSTREAMER_PORT}:7000

  ###########
  ### AIO ###
  ###########
  aiostreams:
    image: ghcr.io/viren070/aiostreams:v2.33.2
    container_name: aiostreams
    restart: unless-stopped
    depends_on:
      stremthru:
        condition: service_started
      redis:
        condition: service_healthy
      tailscale-addon-proxy:
        condition: service_started
    environment:
      ADDON_NAME: ${AIOSTREAMS_ADDON_NAME}
      ADDON_ID: ${AIOSTREAMS_ADDON_ID}
      PORT: 3000
      BASE_URL: ${AIOSTREAMS_BASE_URL}
      SECRET_KEY: ${AIOSTREAMS_SECRET_KEY}
      NZB_PROXY_PUBLIC_ENABLED: "true"
      AIOSTREAMS_AUTH: ${AIOSTREAMS_AUTH:-}
      DATABASE_URI: sqlite:///app/data/db.sqlite
      BUILTIN_STREMTHRU_URL: http://stremthru:8080
      MEDIAFUSION_URL: http://mediafusion:8000
      MEDIAFUSION_API_PASSWORD: ${MEDIAFUSION_API_PASSWORD}
      ADDON_PROXY: http://tailscale-addon-proxy:1055
      ADDON_PROXY_CONFIG: ${AIOSTREAMS_ADDON_PROXY_CONFIG}
      REGEX_FILTER_ACCESS: all
      STREMTHRU_TORZ_URL: http://stremthru:8080/stremio/torz
      STREMTHRU_STORE_URL: http://stremthru:8080/stremio/store
      STREAM_URL_MAPPINGS: '{"http://stremthru:8080":"http://ddyo:8447","http://mediafusion:8000":"http://ddyo:8001","http://comet:8000":"http://ddyo:8989"}'
      # Redis for persistent caching (db 2 - db 0 is aiometadata, db 1 is mediafusion)
      REDIS_URI: redis://redis:6379/2
      # Cache streams for 48 hours (172800s) to benefit from daily prefetcher runs
      STREAM_CACHE_TTL: "172800"
      # No usenet vars set.
    volumes:
      - ./data/aiostreams:/app/data
    ports:
      - ${AIOSTREAMS_PORT}:3000

  tailscale-addon-proxy:
    image: tailscale/tailscale:v1.102.3
    container_name: tailscale-addon-proxy
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TAILSCALE_ADDON_PROXY_AUTHKEY}
      TS_HOSTNAME: ${TAILSCALE_ADDON_PROXY_HOSTNAME}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_OUTBOUND_HTTP_PROXY_LISTEN: 0.0.0.0:1055
      TS_EXTRA_ARGS: --exit-node=${TAILSCALE_ADDON_PROXY_EXIT_NODE} --exit-node-allow-lan-access
    volumes:
      - ./data/tailscale-addon-proxy:/var/lib/tailscale

  aiometadata:
    image: ghcr.io/cedya77/aiometadata@sha256:1c0a0f10a609533b33ee350e04ac517f63d83ae21002658778b1b8f5263c1beb
    container_name: aiometadata
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PORT: 3232
      HOST_NAME: ${AIOMETADATA_HOST_NAME}
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URI: sqlite://addon/data/db.sqlite
      REDIS_URL: redis://redis:6379/0
      TMDB_API_KEY: ${TMDB_API_KEY}
      TVDB_API_KEY: ${TVDB_API_KEY}
      FANART_API_KEY: ${FANART_API_KEY}
      RPDB_API_KEY: ${RPDB_API_KEY}
      MDBLIST_API_KEY: ${MDBLIST_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      CACHE_WARMUP_UUIDS: 2c40fe2d-631a-42b7-a7ac-d860131e9803
      CACHE_WARMUP_MODE: essential
      CATALOG_LIST_ITEMS_SIZE: 40
      # disable MAL warmup (anime-related)
      MAL_WARMUP_ENABLED: "false"
      MAL_WARMUP_SCHEDULE: "false"
      MAL_WARMUP_PRIORITY: "false"
    volumes:
      - ./data/aiometadata:/app/addon/data
    ports:
      - ${AIOMETADATA_PORT}:3232

  ### MISC ###
  # stremio-ai-search:
  #   image: stremio-stack-stremio-ai-search:latest
  #   container_name: stremio-ai-search
  #   restart: unless-stopped
  #   environment:
  #     PORT: 7000
  #     GEMINI_API_KEY: ${GEMINI_API_KEY}
  #     TMDB_API_KEY: ${TMDB_API_KEY}
  #     TRAKT_CLIENT_ID: ${TRAKT_CLIENT_ID}
  #     TRAKT_CLIENT_SECRET: ${TRAKT_CLIENT_SECRET}
  #     RPDB_API_KEY: ${RPDB_API_KEY}
  #     ENCRYPTION_KEY: ${STREMIO_AI_ENCRYPTION_KEY}
  #     ENABLE_LOGGING: true
  #   ports:
  #     - ${STREMIO_AI_SEARCH_PORT}:7000

  # multi account manager
  syncio:
    image: ghcr.io/iamneur0/syncio:private-v1.2.0
    container_name: syncio
    restart: unless-stopped
    environment:
      JWT_SECRET: ${SYNCIO_JWT_SECRET}
      ENCRYPTION_KEY: ${SYNCIO_ENCRYPTION_KEY}
      DATABASE_URL: "file:/app/data/sqlite.db"
    user: "1002:1002"
    volumes:
      - ./data/syncio:/app/data
    ports:
      - 3000:3000
      - 4000:4000

  # Scrobble/watch-history tracking (Trakt)
  # stremio-trakt-addon:
  #   image: reddravenn/stremio-trakt-addon
  #   container_name: stremio-trakt-addon
  #   restart: unless-stopped
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   environment:
  #     PORT: 7000
  #     BASE_URL: ${STREMIO_TRAKT_ADDON_BASE_URL}
  #     DB_USER: ${POSTGRES_USER}
  #     DB_HOST: postgres
  #     DB_NAME: ${TRAKT_DB}
  #     DB_PASSWORD: ${POSTGRES_PASSWORD}
  #     DB_PORT: ${POSTGRES_PORT}
  #     REDIS_HOST: redis
  #     REDIS_PORT: 6379
  #     TRAKT_CLIENT_ID: ${TRAKT_CLIENT_ID}
  #     TRAKT_CLIENT_SECRET: ${TRAKT_CLIENT_SECRET}
  #     LOG_LEVEL: info
  #     NODE_ENV: production
  #   volumes:
  #     - ./data/stremio-trakt-addon/cache:/usr/src/app/cache
  #     - ./data/stremio-trakt-addon/log:/usr/src/app/log
  #   ports:
  #     - ${STREMIO_TRAKT_ADDON_PORT}:7000

  # ---------------------------------------------------------------------------
  # Streams Prefetcher - pre-cache addon streams for instant playback
  # Disabled by default; scheduled/manual runs must enable the prefetch profile.
  # ---------------------------------------------------------------------------
  streams-prefetcher:
    image: registry.gitlab.com/deejay189393/streams-prefetcher:latest
    container_name: streams-prefetcher
    profiles: ["prefetch"]
    restart: unless-stopped
    environment:
      TZ: Asia/Jerusalem
      LOG_LEVEL: INFO
      LOG_FORMAT: json
    volumes:
      - ./data/streams-prefetcher:/app/data
    ports:
      - ${STREAMS_PREFETCHER_PORT:-5000}:5000
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  watchly:
    image: ghcr.io/timilsinabimal/watchly:1.13.1
    container_name: watchly
    restart: unless-stopped
    environment:
      TMDB_API_KEY: ${TMDB_API_KEY}
      TOKEN_SALT: ${WATCHLY_TOKEN_SALT}
      HOST_NAME: ${WATCHLY_HOST_NAME}
      TOKEN_TTL_SECONDS: 0
      AUTO_UPDATE_CATALOGS: true
      CATALOG_REFRESH_INTERVAL_SECONDS: 86400
      CATALOG_CACHE_TTL: 43200
      CATALOG_STALE_TTL: 604800
      ENABLE_TOKEN_NEGATIVE_CACHE: false
      ENABLE_TOKEN_RATE_LIMIT: false
      PORT: 8000
      REDIS_URL: redis://redis:6379/3
      DEFAULT_GEMINI_MODEL: gemini-3.1-flash-lite
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - ${WATCHLY_PORT}:8000
    depends_on:
      - redis
