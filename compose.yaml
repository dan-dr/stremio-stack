name: stremio-stack

services:
  # ---------------------------------------------------------------------------
  # Shared infra (consolidated)
  # ---------------------------------------------------------------------------
  postgres:
    # Postgres 17
    # We also use it as the single Postgres instance for MediaFusion/Comet/Zilean/Trakt-addon.
    image: postgres:17-alpine
    container_name: stremio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - ${POSTGRES_PORT}:5432
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "huge_pages=off"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "max_worker_processes=8"
      - "-c"
      - "max_parallel_workers_per_gather=2"
      - "-c"
      - "max_parallel_workers=4"
      - "-c"
      - "max_parallel_maintenance_workers=2"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./initdb/100-create-dbs.sh:/docker-entrypoint-initdb.d/100-create-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: stremio-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Stream sources (AIOStreams upstreams)
  # ---------------------------------------------------------------------------
  comet:
    image: ghcr.io/g0ldyy/comet@sha256:1d423aafbd57bc16de1a936b8822279762ccd599c5fccebc2e99d1f47e8b2ce3
    container_name: comet
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_TYPE: postgresql
      # Comet expects user:pass@host:port/db (no scheme)
      DATABASE_URL: ${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${COMET_DB}
      FASTAPI_PORT: 8000
      ADMIN_DASHBOARD_PASSWORD: ${COMET_ADMIN_PASSWORD}
      # Debrid
      REAL_DEBRID_API_KEY: ${REAL_DEBRID_API_KEY}
      # No anime
      ANIME_MAPPING_ENABLED: "false"
    ports:
      - ${COMET_PORT}:8000

  zilean:
    image: ipromknight/zilean:v3.5.0
    container_name: zilean
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      Zilean__EnableDashboard: "true"
      Zilean__Database__ConnectionString: Host=postgres;Database=${ZILEAN_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Include Error Detail=true;Timeout=30;CommandTimeout=3600
      Zilean__Imdb__UseAllCores: "true"
      Zilean__Imdb__UseLucene: "true"
      Zilean__Parsing__BatchSize: "100000"
      Zilean__Dmm_ScrapeSchedule: "32 * * * *"
    ports:
      - ${ZILEAN_PORT}:8181

  stremthru:
    image: muniftanjim/stremthru:0.96.3
    container_name: stremthru
    restart: unless-stopped
    environment:
      STREMTHRU_BASE_URL: ${STREMTHRU_BASE_URL}
      STREMTHRU_PORT: 8080
      STREMTHRU_LOG_LEVEL: INFO
      STREMTHRU_LOG_FORMAT: json
      STREMTHRU_VAULT_SECRET: ${STREMTHRU_VAULT_SECRET}
      # Store creds: username:store_name:store_token (use * as fallback username)
      STREMTHRU_STORE_AUTH: "*:${STREMTHRU_STORE_NAME}:${REAL_DEBRID_API_KEY}"
      # Content proxy on by default for the store
      STREMTHRU_STORE_CONTENT_PROXY: "${STREMTHRU_STORE_NAME}:true"
      STREMTHRU_CONTENT_PROXY_CONNECTION_LIMIT: "*:0"
      # Keep StremThru on sqlite (avoids extra DB/user mgmt)
      STREMTHRU_DATABASE_URI: sqlite:///app/data/stremthru.sqlite
    volumes:
      - ./data/stremthru:/app/data
    ports:
      - ${STREMTHRU_PORT}:8080

  ###################
  ### MEDIAFUSION ###
  ###################
  mediafusion:
    image: mhdzumair/mediafusion:4.3.35
    container_name: mediafusion
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      browserless:
        condition: service_started
    environment:
      HOST_URL: ${MEDIAFUSION_HOST_URL}
      SECRET_KEY: ${MEDIAFUSION_SECRET_KEY}
      API_PASSWORD: ${MEDIAFUSION_API_PASSWORD}
      LOGGING_LEVEL: INFO
      # PostgreSQL (native)
      POSTGRES_URI: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${MEDIAFUSION_DB}
      MONGO_URI: mongodb://mongo:27017/mediafusion
      # Shared redis (use db 1)
      REDIS_URL: redis://redis:6379/1
      # Browserless
      PLAYWRIGHT_CDP_URL: ws://browserless:${BROWSERLESS_PORT}?blockAds=true&stealth=true
      # Debrid
      REAL_DEBRID_API_KEY: ${REAL_DEBRID_API_KEY}
      # Don't use Torrentio
      IS_SCRAP_FROM_TORRENTIO: "true"
    ports:
      - ${MEDIAFUSION_PORT}:8000

  mediafusion-dramatiq-worker:
    image: mhdzumair/mediafusion:4.3.35
    container_name: mediafusion-dramatiq-worker
    restart: unless-stopped
    command: ["dramatiq", "api.task", "-p", "1", "-t", "4"]
    depends_on:
      mediafusion:
        condition: service_started
    environment:
      HOST_URL: ${MEDIAFUSION_HOST_URL}
      SECRET_KEY: ${MEDIAFUSION_SECRET_KEY}
      API_PASSWORD: ${MEDIAFUSION_API_PASSWORD}
      MONGO_URI: mongodb://mongo:27017/mediafusion
      LOGGING_LEVEL: INFO
      POSTGRES_URI: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${MEDIAFUSION_DB}
      REDIS_URL: redis://redis:6379/1
      PLAYWRIGHT_CDP_URL: ws://browserless:${BROWSERLESS_PORT}?blockAds=true&stealth=true
      REAL_DEBRID_API_KEY: ${REAL_DEBRID_API_KEY}
      IS_SCRAP_FROM_TORRENTIO: "true"
      
  # mongo:
  #   image: bitnami/mongodb
  #   restart: unless-stopped
  #   volumes:
  #     - ./data/mongodb:/bitnami/mongodb
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - ./data/mongodb:/data/db

  browserless:
    # Used by MediaFusion (Playwright CDP)
    image: ghcr.io/browserless/chromium:v2.38.4
    container_name: browserless
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/json/version"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      TIMEOUT: "-1"
    ports:
      - ${BROWSERLESS_PORT}:3000

  ###########
  ### AIO ###
  ###########
  aiostreams:
    image: ghcr.io/viren070/aiostreams:v2.22.0
    container_name: aiostreams
    restart: unless-stopped
    depends_on:
      stremthru:
        condition: service_started
    environment:
      ADDON_NAME: ${AIOSTREAMS_ADDON_NAME}
      ADDON_ID: ${AIOSTREAMS_ADDON_ID}
      PORT: 3000
      BASE_URL: ${AIOSTREAMS_BASE_URL}
      SECRET_KEY: ${AIOSTREAMS_SECRET_KEY}
      ADDON_PASSWORD: ${AIOSTREAMS_ADDON_PASSWORD}
      DATABASE_URI: sqlite:///app/data/db.sqlite
      BUILTIN_STREMTHRU_URL: http://stremthru:8080
      MEDIAFUSION_URL: http://mediafusion:8000
      MEDIAFUSION_API_PASSWORD: ${MEDIAFUSION_API_PASSWORD}
      REGEX_FILTER_ACCESS: all
      STREMTHRU_TORZ_URL: http://stremthru:8080/stremio/torz
      STREMTHRU_STORE_URL: http://stremthru:8080/stremio/store
      STREAM_URL_MAPPINGS: '{"http://stremthru:8080":"http://ddyo:8447","http://mediafusion:8000":"http://ddyo:8001","http://comet:8000":"http://ddyo:8989"}'
      # No usenet vars set.
    volumes:
      - ./data/aiostreams:/app/data
    ports:
      - ${AIOSTREAMS_PORT}:3000

  aiometadata:
    image: ghcr.io/cedya77/aiometadata@sha256:e07705801101bf23a486975f2769bda98cb64b29d2fa9f7713d2141aad356b93
    container_name: aiometadata
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PORT: 3232
      HOST_NAME: ${AIOMETADATA_HOST_NAME}
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URI: sqlite://addon/data/db.sqlite
      REDIS_URL: redis://redis:6379/0
      TMDB_API: ${TMDB_API_KEY}
      TVDB_API_KEY: ${TVDB_API_KEY}
      FANART_API_KEY: ${FANART_API_KEY}
      RPDB_API_KEY: ${RPDB_API_KEY}
      MDBLIST_API_KEY: ${MDBLIST_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      CACHE_WARMUP_UUIDS: 2c40fe2d-631a-42b7-a7ac-d860131e9803
      CACHE_WARMUP_MODE: comprehensive
      CATALOG_LIST_ITEMS_SIZE: 40
      # disable MAL warmup (anime-related)
      MAL_WARMUP_ENABLED: "false"
      MAL_WARMUP_SCHEDULE: "false"
      MAL_WARMUP_PRIORITY: "false"
    volumes:
      - ./data/aiometadata:/app/addon/data
    ports:
      - ${AIOMETADATA_PORT}:3232

  aiolists:
    image: stremio-stack-aiolists:latest
    container_name: aiolists
    restart: unless-stopped
    environment:
      PORT: 7000
      NODE_ENV: production
      TMDB_BEARER_TOKEN: ${TMDB_BEARER_TOKEN}
      TMDB_REDIRECT_URI: ${TMDB_REDIRECT_URI}
    ports:
      - ${AIOLISTS_PORT}:7000

  ### MISC ###
  # stremio-ai-search:
  #   image: stremio-stack-stremio-ai-search:latest
  #   container_name: stremio-ai-search
  #   restart: unless-stopped
  #   environment:
  #     PORT: 7000
  #     GEMINI_API_KEY: ${GEMINI_API_KEY}
  #     TMDB_API_KEY: ${TMDB_API_KEY}
  #     TRAKT_CLIENT_ID: ${TRAKT_CLIENT_ID}
  #     TRAKT_CLIENT_SECRET: ${TRAKT_CLIENT_SECRET}
  #     RPDB_API_KEY: ${RPDB_API_KEY}
  #     ENCRYPTION_KEY: ${STREMIO_AI_ENCRYPTION_KEY}
  #     ENABLE_LOGGING: true
  #   ports:
  #     - ${STREMIO_AI_SEARCH_PORT}:7000

  # multi account manager
  syncio:
    image: ghcr.io/iamneur0/syncio:public-v0.4.0
    container_name: syncio
    restart: unless-stopped
    environment:
      JWT_SECRET: ${SYNCIO_JWT_SECRET}
      ENCRYPTION_KEY: ${SYNCIO_ENCRYPTION_KEY}
      DATABASE_URL: "file:/app/data/sqlite.db"
    volumes:
      - ./data/syncio:/app/data
    ports:
      - ${SYNCIO_PORT_FE}:3000
      - ${SYNCIO_PORT_BE}:4000

  # Scrobble/watch-history tracking (Trakt)
  # stremio-trakt-addon:
  #   image: reddravenn/stremio-trakt-addon
  #   container_name: stremio-trakt-addon
  #   restart: unless-stopped
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   environment:
  #     PORT: 7000
  #     BASE_URL: ${STREMIO_TRAKT_ADDON_BASE_URL}
  #     DB_USER: ${POSTGRES_USER}
  #     DB_HOST: postgres
  #     DB_NAME: ${TRAKT_DB}
  #     DB_PASSWORD: ${POSTGRES_PASSWORD}
  #     DB_PORT: ${POSTGRES_PORT}
  #     REDIS_HOST: redis
  #     REDIS_PORT: 6379
  #     TRAKT_CLIENT_ID: ${TRAKT_CLIENT_ID}
  #     TRAKT_CLIENT_SECRET: ${TRAKT_CLIENT_SECRET}
  #     LOG_LEVEL: info
  #     NODE_ENV: production
  #   volumes:
  #     - ./data/stremio-trakt-addon/cache:/usr/src/app/cache
  #     - ./data/stremio-trakt-addon/log:/usr/src/app/log
  #   ports:
  #     - ${STREMIO_TRAKT_ADDON_PORT}:7000

  watchly:
    image: ghcr.io/timilsinabimal/watchly:1.7.0
    container_name: watchly
    restart: unless-stopped
    environment:
      TMDB_API_KEY: ${TMDB_API_KEY}
      TOKEN_SALT: ${WATCHLY_TOKEN_SALT}
      HOST_NAME: ${HOST_BASE_URL}:${WATCHLY_PORT}
      TOKEN_TTL_SECONDS: 0
      AUTO_UPDATE_CATALOGS: true
      PORT: 8000
      REDIS_URL: redis://redis:6379/2
    ports:
      - ${WATCHLY_PORT}:8000
    depends_on:
      - redis